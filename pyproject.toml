[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. The bare `amperstand` was taken on PyPI by an
# unrelated minimalistic-static-site-generator (Nathan Scott, 7 releases),
# so we publish as `amperstand-core` instead. The full project rename to
# Amperstand follows in a separate commit; this pyproject change is just
# the PyPI surface.
name = "amperstand-core"
version = "0.2.0"
description = "Amperstand engine — extraction, storage, search, and the HTTP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.8",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "python-ulid>=2.0",
    "html-to-markdown>=3.0",
    "sqlite-vec>=0.1.6",
    "openai>=1.50",
    "tiktoken>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
amperstand-server = "amperstand_core.server.__main__:main"
amperstand-admin = "amperstand_core.server.admin_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amperstand_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
