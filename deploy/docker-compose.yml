# docker-compose.yml — Amperstand server + Caddy on one box.
#
# Quick start:
#   cd deploy
#   # Generate AMPERSTAND_API_KEY into .env (one time):
#   echo "AMPERSTAND_API_KEY=$(openssl rand -hex 32)" > .env
#   # Optional, for /chat + semantic + hybrid search:
#   echo "OPENAI_API_KEY=sk-..." >> .env
#   # Required for LinkedIn / YouTube / Reddit capture and walled pages:
#   echo "ANYSITE_ACCESS_TOKEN=..." >> .env
#   docker compose up -d
#   docker compose logs -f
#
# Then hit:
#   curl http://localhost/health                                          (via Caddy)
#   curl -H "Authorization: Bearer $AMPERSTAND_API_KEY" http://localhost/vault
#
# What's NOT here:
#   - Telegram bot, browser extension, email-watch, vault-watcher, feed-sync.
#     Those run as the user CLI / separate processes. The compose stack is
#     server-only (API + storage).
#   - TLS. Add `caddy/Caddyfile.tls` after pointing a domain at this box.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: amperstand-server
    restart: unless-stopped
    environment:
      AMPERSTAND_API_KEY: ${AMPERSTAND_API_KEY:?set AMPERSTAND_API_KEY in .env}
      AMPERSTAND_DATA_DIR: /var/lib/amperstand/vault
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANYSITE_ACCESS_TOKEN: ${ANYSITE_ACCESS_TOKEN:-}
      AMPERSTAND_AUDIO_TRANSCRIPTION: ${AMPERSTAND_AUDIO_TRANSCRIPTION:-}
    volumes:
      - vault:/var/lib/amperstand
    expose:
      - "8765"
    networks:
      - amperstand

  caddy:
    image: caddy:2-alpine
    container_name: amperstand-caddy
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - amperstand

volumes:
  vault:
  caddy_data:
  caddy_config:

networks:
  amperstand:
